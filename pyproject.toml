[project]
name = "support-rag-agent"
version = "0.1.0"
description = "Customer-support RAG agent with hybrid Elasticsearch retrieval and MCP tool-calling"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-mcp-adapters>=0.1.0",
  "mcp>=1.2.0,<2",
  "anthropic>=0.45.0",
  "elasticsearch>=8.14.0",
  "sentence-transformers>=3.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401", "ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"eval/dataset/generate_tickets.py" = ["E501"]

[tool.mypy]
strict = true
warn_unreachable = true
ignore_missing_imports = true

# Heavy ML deps ship stubs that are slow to check and, in numpy's case, use
# PEP 695 syntax the pinned interpreter may not parse. Nothing here depends
# on their types beyond opaque model objects.
[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "sentence_transformers.*", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
